function showDetail(id){chosen=id;let p=P[id];$('detail-name').textContent=p.zh;$('detail-en').textContent=p.en;$('detail-desc').textContent=p.desc;$('detail-time').textContent=p.time;$('detail-cost').textContent=p.cost;
$('detail-go').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lon);
$('detail').classList.add('show');document.querySelectorAll('.stop').forEach(el=>el.classList.toggle('active',el.dataset.id===id));document.querySelectorAll('.map-tag').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));}
function focusStop(id){const p=P[id];showDetail(id);if(map){let offset=window.innerWidth>760?[145,0]:[0,Math.min(100,window.innerHeight*.12)];map.easeTo({center:[p.lon,p.lat],zoom:16.3,offset,duration:550});}else fallbackFocus(p)}
$('close').onclick=()=>{$('detail').classList.remove('show');chosen=null;document.querySelectorAll('.stop,.map-tag').forEach(el=>el.classList.remove('active'))};
function fit(){if(map){map.fitBounds([[boundsAll[0],boundsAll[1]],[boundsAll[2],boundsAll[3]]],{padding:window.innerWidth>760?{top:70,right:120,bottom:70,left:405}:{top:70,right:25,bottom:Math.max(260,window.innerHeight*.42),left:25},duration:500,maxZoom:16});}else{svgReset()}}
function zoom(d){if(map){map.zoomTo(map.getZoom()+d,{duration:230});}else svgZoom(d)}
$('fit').onclick=fit;$('zoomplus').onclick=()=>zoom(1);$('zoomminus').onclick=()=>zoom(-1);
function showToast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
$('share').onclick=()=>{if(location.protocol==='file:'){showToast('这是本地文件；部署到网页后才能复制公网链接');return;}const url=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>showToast('已复制地图链接')).catch(()=>showToast('请复制浏览器地址栏的链接'));}else showToast('请复制浏览器地址栏的链接')};
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===m));
for(const x of document.querySelectorAll('.part-title')){x.hidden=(m==='am'&&x.dataset.part==='pm')||(m==='pm'&&x.dataset.part==='am')}
$('stops-am').hidden=m==='pm';$('stops-lunch').hidden=false;$('stops-pm').hidden=m==='am';
if(map&&map.getLayer('routes-am')){map.setLayoutProperty('routes-am','visibility',m==='pm'?'none':'visible');map.setLayoutProperty('routes-pm','visibility',m==='am'?'none':'visible');}
updateFallback(m);if(map){let ids=m==='am'?['hotel','palace']:m==='pm'?['hotel','queen','grand','petit','hamlet']:PTS.map(x=>x.id);let pp=ids.map(id=>P[id]);let mm={minX:Math.min(...pp.map(x=>x.lon)),maxX:Math.max(...pp.map(x=>x.lon)),minY:Math.min(...pp.map(x=>x.lat)),maxY:Math.max(...pp.map(x=>x.lat))};map.fitBounds([[mm.minX,mm.minY],[mm.maxX,mm.maxY]],{padding:window.innerWidth>760?{top:120,right:120,bottom:100,left:410}:{top:85,right:40,bottom:Math.max(250,window.innerHeight*.42),left:40},duration:500,maxZoom:16.2})}else svgReset(m)}
document.querySelectorAll('.mode').forEach(x=>x.addEventListener('click',()=>setMode(x.dataset.mode)));
// SVG offline fallback: geographically placed markers and interactive pan/zoom.
const sx=lon=>(lon-2.1000)/(.0260)*1000;
const sy=lat=>(48.8210-lat)/(.0190)*650;
const SVGNS='http://www.w3.org/2000/svg', svg=$('fallback'),lineG=$('fallback-lines'),pinG=$('fallback-markers');if(window.innerWidth<=760)svg.setAttribute('preserveAspectRatio','xMidYMin meet');
const svgElt=(tag,attrs,txt)=>{const x=document.createElementNS(SVGNS,tag);for(const [a,v] of Object.entries(attrs||{}))x.setAttribute(a,String(v));if(txt!=null)x.textContent=txt;return x};
let vb={x:0,y:0,w:1000,h:650},drag=null;
function vbSet(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function svgReset(m='all'){
  const ids=m==='am'?['hotel','palace']:m==='pm'?['hotel','queen','grand','petit','hamlet']:PTS.map(p=>p.id);
  const ps=ids.map(id=>P[id]);const xs=ps.map(p=>sx(p.lon));const ys=ps.map(p=>sy(p.lat));
  const minx=Math.min(...xs)-110,maxx=Math.max(...xs)+240,miny=Math.min(...ys)-105,maxy=Math.max(...ys)+105;
  if(window.innerWidth>760){
    const center=(minx+maxx)/2, range=(maxx-minx), visibleW=range*1.43;
    vb={x:center-visibleW*.66,y:miny-45,w:Math.max(1100,visibleW),h:Math.max(740,maxy-miny+80)};
  }else{
    vb={x:minx-100,y:miny-10,w:Math.max(1050,maxx-minx+180),h:Math.max(750,maxy-miny+180)};
  }
  vbSet();
}
function fallbackFocus(p){let x=sx(p.lon),y=sy(p.lat);vb={x:x-190,y:y-145,w:500,h:380};vbSet()}
function svgZoom(n){const factor=Math.pow(.82,n),cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.max(100,Math.min(1800,vb.w*factor));vb.h=Math.max(95,Math.min(1200,vb.h*factor));vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;vbSet()}
svg.addEventListener('wheel',ev=>{if(document.body.classList.contains('ready'))return;ev.preventDefault();svgZoom(ev.deltaY<0?1:-1)},{passive:false});
svg.addEventListener('pointerdown',ev=>{if(ev.target.closest('.svgmarker'))return;drag={x:ev.clientX,y:ev.clientY,vb:{...vb}};svg.setPointerCapture(ev.pointerId)});
svg.addEventListener('pointermove',ev=>{if(!drag)return;const w=svg.getBoundingClientRect().width,h=svg.getBoundingClientRect().height;vb.x=drag.vb.x-(ev.clientX-drag.x)*vb.w/w;vb.y=drag.vb.y-(ev.clientY-drag.y)*vb.h/h;vbSet()});
svg.addEventListener('pointerup',()=>drag=null);
function drawFallback(){lineG.innerHTML='';for(let [kind,ids] of Object.entries(routes)){let pp=ids.map(id=>P[id]);let p=svgElt('polyline',{points:pp.map(v=>`${sx(v.lon)},${sy(v.lat)}`).join(' '),fill:'none',stroke:kind==='am'?'#3367D6':'#E68644','stroke-width':'5','stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':'9 11',opacity:'.87'});lineG.appendChild(p)}
for(let p of PTS){let g=svgElt('g',{class:'svgmarker',transform:`translate(${sx(p.lon)},${sy(p.lat)})`,cursor:'pointer',tabindex:0});const labelW=p.id==='hamlet'?179:p.id==='palace'?155:p.id==='queen'?137:p.id==='hotel'?156:147;
 g.appendChild(svgElt('rect',{x:-17,y:-21,width:labelW,height:39,rx:19,fill:'#fff',stroke:'#dfe6e8','stroke-width':'1.5'}));g.appendChild(svgElt('circle',{r:15,cx:0,cy:-1,fill:p.color}));g.appendChild(svgElt('text',{x:0,y:3,'text-anchor':'middle','font-size':12,'font-weight':770,fill:'#fff'},p.z));g.appendChild(svgElt('text',{x:23,y:3,'font-size':12,'font-weight':720,fill:'#304453'},p.zh));g.onclick=()=>focusStop(p.id);pinG.appendChild(g)}}
function updateFallback(m){for(let c of lineG.children)c.style.display=(m==='all'||c===lineG.children[m==='am'?0:1])?'':'none';for(let c of pinG.children){let id=PTS[[...pinG.children].indexOf(c)].id;c.style.opacity=m==='all'||m==='am'&&parts.am.includes(id)||m==='pm'&&(id==='hotel'||parts.pm.includes(id))?'1':'.35'}}
drawFallback();svgReset();
// Real interactive map with clean vector streets; no Google API key needed.
function init(){if(typeof maplibregl==='undefined'){$('ribbon-sub').textContent='离线示意地图 · 可点选';return}
try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[2.1135,48.8114],zoom:14.5,attributionControl:true,dragRotate:false,pitchWithRotate:false,cooperativeGestures:false});map.scrollZoom.enable();
map.on('load',()=>{map.addSource('route',{type:'geojson',data:routeGeo});for(const [kind,color] of [['am','#3367D6'],['pm','#E68644']]){map.addLayer({id:'routes-'+kind,type:'line',source:'route',filter:['==',['get','kind'],kind],paint:{'line-color':color,'line-width':4,'line-opacity':.88,'line-dasharray':[1.4,1.5]},layout:{'line-join':'round','line-cap':'round'}})}
for(let p of PTS){let el=document.createElement('div');el.className='map-tag';el.dataset.id=p.id;el.title=p.en;el.innerHTML=`<span class="map-number" style="background:${p.color}">${p.z}</span><span><span class="map-label">${p.zh}</span><div class="map-sub">${p.en.split(' · ')[0]}</div></span>`;el.onclick=ev=>{ev.stopPropagation();focusStop(p.id)};new maplibregl.Marker({element:el,anchor:'left'}).setLngLat([p.lon,p.lat]).addTo(map)}
map.on('click',e=>{if(e.originalEvent?.target?.closest('.map-tag'))return;$('detail').classList.remove('show')});document.body.classList.add('ready');setTimeout(fit,180);loadWalkingRoutes();});map.on('error',()=>{});
}catch(e){console.log('Maplibre unavailable, SVG fallback active',e);map=null}}
// Optional route upgrade: OSM-based route service, only when reachable.
// Missing CORS or closed park paths fall back to clearly labelled dashed visit order.
async function loadWalkingRoutes(){const urlFor=kind=>{let xy=routes[kind].map(id=>`${P[id].lon},${P[id].lat}`).join('|');return 'https://brouter.de/brouter?lonlats='+encodeURIComponent(xy)+'&profile=trekking&alternativeidx=0&format=geojson'};
try{let ctr=new AbortController(),tid=setTimeout(()=>ctr.abort(),5500);let results=await Promise.all(['am','pm'].map(k=>fetch(urlFor(k),{signal:ctr.signal}).then(r=>{if(!r.ok)throw Error('route');return r.json()})));clearTimeout(tid);
let features=[];for(let i=0;i<results.length;i++){let result=results[i],f=result.type==='FeatureCollection'?result.features?.[0]:result.type==='Feature'?result:null;if(!f?.geometry?.coordinates?.length||f.geometry.type!=='LineString')throw Error('shape');features.push({...f,properties:{...(f.properties||{}),kind:i===0?'am':'pm'}})}
routeGeo.features=features;map.getSource('route').setData(routeGeo);for(const kind of ['am','pm'])map.setPaintProperty('routes-'+kind,'line-dasharray',[1,0]);routeReady=true;$('route-note').textContent='彩色实线参考 OSM 步行路网；部分园区步道/入口可能临时关闭，请以当日现场标识为准。';$('ribbon-sub').textContent='OSM 步行线路 · 点击景点';
}catch(err){$('ribbon-sub').textContent='规划线路示意 · 点击景点'}}
window.addEventListener('resize',()=>{if(map)map.resize()});
window.addEventListener('DOMContentLoaded',()=>setTimeout(init,130));
})();
</script>
